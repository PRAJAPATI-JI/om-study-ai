name: Deploy AI backend (Cloudflare)

# हाथ से चलाइए: Actions → "Deploy AI backend (Cloudflare)" → Run workflow
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend tests
        run: npm test
      - name: Check secrets exist
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::GitHub secret $v नहीं मिला। README_BACKEND_HINDI.md देखिए।"; exit 1; fi
          done
      - name: Create D1 database if missing and write its id
        run: |
          npx --yes wrangler@4 d1 list --json > d1.json
          ID=$(node -e "const l=JSON.parse(require('fs').readFileSync('d1.json','utf8'));const d=l.find(x=>x.name==='om-study-ai');console.log(d?d.uuid:'')")
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 d1 create om-study-ai
            npx --yes wrangler@4 d1 list --json > d1.json
            ID=$(node -e "const l=JSON.parse(require('fs').readFileSync('d1.json','utf8'));console.log(l.find(x=>x.name==='om-study-ai').uuid)")
          fi
          sed -i "s/REPLACE_BY_DEPLOY_WORKFLOW/$ID/" wrangler.toml
      - name: Apply DB migrations
        run: npx --yes wrangler@4 d1 migrations apply om-study-ai --remote
      - name: Deploy Worker
        env:
          OWNER_UID: ${{ secrets.OWNER_UID }}
        run: |
          if [ -n "$OWNER_UID" ]; then
            npx --yes wrangler@4 deploy --var OWNER_UID:"$OWNER_UID"
          else
            npx --yes wrangler@4 deploy
          fi
      - name: Set MASTER_KEY secret (if provided)
        env:
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
        run: |
          if [ -n "$MASTER_KEY" ]; then printf '%s' "$MASTER_KEY" | npx --yes wrangler@4 secret put MASTER_KEY; else echo "::warning::MASTER_KEY secret नहीं मिला — API keys सेव नहीं होंगी"; fi
